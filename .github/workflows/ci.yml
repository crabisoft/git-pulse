name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every step below is a make target, and nothing else. The recipe, the Node
# version, the database and Redis images all live in the repository — in the
# Makefile and in .docker — so `make check` on a workstation runs what this file
# runs. A step written here and nowhere else would only be verifiable after a
# push, and would drift from what the project actually does.
jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No setup-node: the checks run in the dev image, whose Node comes from
      # NODE_IMAGE in .docker/.env. One place states the version.
      - name: Install and generate
        run: make prepare

      - name: Typecheck
        run: make typecheck

      - name: Unit tests
        run: make test

      - name: Build the component catalogue
        run: make catalogue

      # The suites mock Prisma from end to end, so this is the only step that
      # applies a migration, constructs a client and asks the API a question.
      - name: Boot against a real database
        run: make smoke

  images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the production images
        run: make images
