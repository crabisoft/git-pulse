name: Publish images

# Trying a self-hosted tool should not mean cloning it and waiting for a build.
# Every push to main republishes `latest`; a tag publishes the version too.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - component: api
            dockerfile: .docker/Dockerfile.back
          - component: web
            dockerfile: .docker/Dockerfile.front
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The web bundle is built with no API URL, so it calls `/api` on its
          # own origin and nginx proxies it. Baking a host in would make the
          # published image work on exactly one deployment — see nginx.conf.
          build-args: |
            VITE_API_URL=
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # amd64 only. arm64 would have to be emulated here, which turns a
          # three-minute npm install into a thirty-minute one; add
          # `platforms: linux/amd64,linux/arm64` the day a runner can do it
          # natively.
          platforms: linux/amd64
