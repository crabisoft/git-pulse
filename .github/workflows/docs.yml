name: User guide

# The guide is published by Read the Docs, which builds with warnings fatal. A
# dead cross-reference or a figure whose file was never committed fails there,
# after the merge — this is the same build, before it.
on:
  push:
    branches: [main]
    paths:
      - 'docs/user/**'
      - '.readthedocs.yaml'
      - '.docker/Dockerfile.dev'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/user/**'
      - '.readthedocs.yaml'
      - '.docker/Dockerfile.dev'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guide:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `make docs` and nothing else: Sphinx and its pinned requirements are
      # installed in the dev image (.docker/Dockerfile.dev), so this builds the
      # guide with the versions a developer builds it with — no Python set up
      # here that exists nowhere else in the project.
      - name: Build the guide
        run: make docs
