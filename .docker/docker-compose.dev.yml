# DEV override — watch mode, source mounted as a volume (hot reload).
#   back  : nest start --watch
#   front : Vite dev server with HMR
# Usage: npm run docker:dev
#
# Both services share a small image (node:24-slim + openssl) so Prisma finds
# libssl. node_modules lives in a named volume (not the host's) mounted over
# the bind-mounted code.
services:
  back:
    build: &dev-build
      context: ..
      dockerfile: .docker/Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-slim}
    image: git-pulse-dev
    working_dir: /app
    # The shared package is compiled once, then kept under `tsc --watch` in the
    # background: the back consumes its dist, so without that watcher a shared
    # type edit would need a full restart to be seen.
    command: >
      sh -c "npm install
      && npm run build:shared
      && npm run prisma:generate -w @repo/back
      && npm run prisma:deploy -w @repo/back
      && (npm run dev:shared &)
      && npm run dev:back"
    environment:
      API_PORT: ${API_PORT:-3001}
      WEB_ORIGIN: http://localhost:${WEB_PORT_DEV:-5173}
      # inotify does not cross the bind mount (Docker Desktop, WSL2): tsc must
      # poll, otherwise `nest start --watch` never sees an edit.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@db:5432/${POSTGRES_DB:-dashboard}?schema=public
      REDIS_URL: redis://redis:6379
      MASTER_KEY_FILE: ${MASTER_KEY_FILE:-/data/master.key}
      # error < warn < log < debug < verbose, each including the ones before
      # it. `debug` makes the version probe name every address it tries.
      LOG_LEVEL: ${LOG_LEVEL:-}
    volumes:
      - ..:/app
      - back-node-modules:/app/node_modules
      # Same as the front's below: what npm cannot hoist must not be written
      # into the host tree by a container running as root.
      - back-local-modules:/app/back/node_modules
      # Build outputs in named volumes so the container never writes (as root)
      # into the host working tree.
      - back-dist:/app/back/dist
      - shared-dist:/app/packages/shared/dist
      - master-key:/data
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
      - "${STUDIO_PORT:-5555}:5555"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    build: *dev-build
    image: git-pulse-dev
    working_dir: /app
    command: >
      sh -c "npm install
      && cd front
      && npx vite --host 0.0.0.0 --port ${WEB_PORT_DEV:-5173}"
    environment:
      # Same-origin in the browser; Vite proxies /api to the back service.
      VITE_PROXY_TARGET: http://back:3001
      # Same reason as TSC_WATCHFILE on the back: chokidar must poll to see the
      # edits made on the host. Read by vite.config.ts.
      VITE_USE_POLLING: "1"
      # Hostnames the dev server answers to besides localhost — a tunnel's, when
      # testing webhooks from a provider. Comma-separated, empty by default.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ..:/app
      - front-node-modules:/app/node_modules
      # Same reason as the dist volumes above, and it was missing: `npm install`
      # writes here whatever it cannot hoist, and Vite and Storybook cache here
      # too. Bound to the host tree, all of it lands as root-owned directories
      # the host user then cannot write into — which is what makes a tool run
      # from the host fail with EACCES on a path it has every right to expect.
      - front-local-modules:/app/front/node_modules
    ports:
      - "${WEB_PORT_DEV:-5173}:${WEB_PORT_DEV:-5173}"
      # The component catalogue, on demand: `make storybook`.
      - "${STORYBOOK_PORT:-6006}:6006"
    depends_on:
      - back

  # The user guide's screenshots — `make screenshots`.
  #
  # Behind a profile, so nothing here starts it: `docker compose up` ignores a
  # service with one, and the image is built the first time the profile is
  # named and reused after — `run` builds only what is missing. That is the
  # point of it being a service at all: a job that runs to completion and then
  # should not exist, not a fifth thing kept alive beside the database.
  #
  # The flip side is an image that no longer follows the Dockerfile below, so
  # editing it — or PLAYWRIGHT_IMAGE — wants `make screenshots rebuild=1`.
  #
  # It needs neither db, nor redis, nor the API: the suite stubs every call
  # from `front/e2e/fixtures.ts`, and Playwright starts a Vite of its own inside
  # this container. So it runs against a stack that is down, and it never sees
  # the one that is up — the 5173 published on the host is not this container's.
  screenshots:
    profiles: ["screenshots"]
    build:
      context: ..
      dockerfile: .docker/Dockerfile.screenshots
      args:
        PLAYWRIGHT_IMAGE: ${PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.62.1-noble}
    image: git-pulse-screenshots
    working_dir: /app
    # As the caller, so the images land in the working tree owned by whoever
    # asked for them. `make screenshots` fills these in; the defaults are for
    # anyone driving compose by hand.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # That user has no home directory in this image, and npm, Vite and
      # Playwright all want somewhere to write.
      HOME: /tmp
      npm_config_cache: /tmp/.npm
    # Which suite to run — the guide's by default, the README's five with
    # `make screenshots suite=screenshots`.
    command: >
      sh -c "npm install
      && npm run build:shared
      && npm run ${SCREENSHOT_SUITE:-screenshots:docs} -w @repo/front"
    volumes:
      - ..:/app
      # Its own dependency volumes, deliberately not the front's: this image is
      # a different base, and a native module built for one is not the other's.
      - screenshots-node-modules:/app/node_modules
      - screenshots-local-modules:/app/front/node_modules

  # Everything the CI runs — `make check`, and each of its parts on its own.
  #
  # Behind a profile like the screenshots container above, and for the same
  # reasons: it runs to completion and then should not exist, and no `up` should
  # ever bring it into being. The CI drives this very service, so a check that
  # passes here is a check that passes there — same image, same Node, same
  # dependencies, and no version of anything written in a workflow file.
  #
  # As the caller, so the build outputs it drops in the working tree (dist,
  # storybook-static) belong to whoever asked for them rather than to root.
  #
  # Its own dependency volumes, deliberately not the back's or the front's:
  # those are installed as root by the watchers, and an `npm ci` racing a
  # running dev stack for the same directory is a broken stack.
  checks:
    profiles: ["checks"]
    build: *dev-build
    image: git-pulse-dev
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # That user has no home directory in this image, and npm wants one.
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      # For `make smoke` only, and on a database of its own: the checks must not
      # migrate, and certainly not reset, the data a developer is working on.
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@db:5432/${SMOKE_DB:-smoke}?schema=public
      SHADOW_DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@db:5432/${SMOKE_DB:-smoke}_shadow?schema=public
      REDIS_URL: redis://redis:6379
      # Generated on first boot in the container's own /tmp and thrown away with
      # it — a smoke run has no secret to keep.
      MASTER_KEY_FILE: /tmp/master.key
      API_PORT: ${API_PORT:-3001}
    volumes:
      - ..:/app
      - checks-node-modules:/app/node_modules
      - checks-back-modules:/app/back/node_modules
      - checks-front-modules:/app/front/node_modules
      - checks-shared-modules:/app/packages/shared/node_modules

volumes:
  back-node-modules:
  back-local-modules:
  front-node-modules:
  front-local-modules:
  screenshots-node-modules:
  screenshots-local-modules:
  checks-node-modules:
  checks-back-modules:
  checks-front-modules:
  checks-shared-modules:
  back-dist:
  shared-dist:
