# DEV override — watch mode, source mounted as a volume (hot reload).
#   back  : nest start --watch
#   front : Vite dev server with HMR
# Usage: npm run docker:dev
#
# Both services share a small image (node:24-slim + openssl) so Prisma finds
# libssl. node_modules lives in a named volume (not the host's) mounted over
# the bind-mounted code.
services:
  back:
    build: &dev-build
      context: ..
      dockerfile: .docker/Dockerfile.dev
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-slim}
    image: git-dashboard-dev
    working_dir: /app
    # The shared package is compiled once, then kept under `tsc --watch` in the
    # background: the back consumes its dist, so without that watcher a shared
    # type edit would need a full restart to be seen.
    command: >
      sh -c "npm install
      && npm run build:shared
      && npm run prisma:generate -w @repo/back
      && npm run prisma:deploy -w @repo/back
      && (npm run dev:shared &)
      && npm run dev:back"
    environment:
      API_PORT: ${API_PORT:-3001}
      WEB_ORIGIN: http://localhost:${WEB_PORT_DEV:-5173}
      # inotify does not cross the bind mount (Docker Desktop, WSL2): tsc must
      # poll, otherwise `nest start --watch` never sees an edit.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@db:5432/${POSTGRES_DB:-dashboard}?schema=public
      REDIS_URL: redis://redis:6379
      MASTER_KEY_FILE: ${MASTER_KEY_FILE:-/data/master.key}
    volumes:
      - ..:/app
      - back-node-modules:/app/node_modules
      # Same as the front's below: what npm cannot hoist must not be written
      # into the host tree by a container running as root.
      - back-local-modules:/app/back/node_modules
      # Build outputs in named volumes so the container never writes (as root)
      # into the host working tree.
      - back-dist:/app/back/dist
      - shared-dist:/app/packages/shared/dist
      - master-key:/data
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    build: *dev-build
    image: git-dashboard-dev
    working_dir: /app
    command: >
      sh -c "npm install
      && cd front
      && npx vite --host 0.0.0.0 --port ${WEB_PORT_DEV:-5173}"
    environment:
      # Same-origin in the browser; Vite proxies /api to the back service.
      VITE_PROXY_TARGET: http://back:3001
      # Same reason as TSC_WATCHFILE on the back: chokidar must poll to see the
      # edits made on the host. Read by vite.config.ts.
      VITE_USE_POLLING: "1"
      # Hostnames the dev server answers to besides localhost — a tunnel's, when
      # testing webhooks from a provider. Comma-separated, empty by default.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    volumes:
      - ..:/app
      - front-node-modules:/app/node_modules
      # Same reason as the dist volumes above, and it was missing: `npm install`
      # writes here whatever it cannot hoist, and Vite and Storybook cache here
      # too. Bound to the host tree, all of it lands as root-owned directories
      # the host user then cannot write into — which is what makes a tool run
      # from the host fail with EACCES on a path it has every right to expect.
      - front-local-modules:/app/front/node_modules
    ports:
      - "${WEB_PORT_DEV:-5173}:${WEB_PORT_DEV:-5173}"
      # The component catalogue, on demand: `make storybook`.
      - "${STORYBOOK_PORT:-6006}:6006"
    depends_on:
      - back

volumes:
  back-node-modules:
  back-local-modules:
  front-node-modules:
  front-local-modules:
  back-dist:
  shared-dist:
