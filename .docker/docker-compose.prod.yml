# PROD override — built images.
#   back  : compiled NestJS API
#   front : static bundle served by nginx
# Usage: npm run docker:prod
services:
  back:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.back
    environment:
      API_PORT: ${API_PORT:-3001}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:-dashboard}@db:5432/${POSTGRES_DB:-dashboard}?schema=public
      REDIS_URL: redis://redis:6379
      MASTER_KEY_FILE: ${MASTER_KEY_FILE:-/data/master.key}
    volumes:
      # Master key persists outside the container — must be backed up.
      - master-key:/data
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    build:
      context: ..
      dockerfile: .docker/Dockerfile.front
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - back
