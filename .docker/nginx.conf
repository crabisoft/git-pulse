server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The API, served from the same origin as the app.
  #
  # This is what lets one published image run anywhere: with no VITE_API_URL
  # baked into the bundle, it calls `/api` on whatever host it was loaded from,
  # so the address of a deployment stops being a build-time decision. Without
  # it, an image built for localhost is an image that runs only on localhost.
  #
  # The upstream is the compose service name and the API's default port; an
  # install that moves either overrides this file.
  location /api/ {
    proxy_pass http://back:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A first collection over a large scope runs for minutes; the browser waits
    # for it rather than being shown a gateway timeout.
    proxy_read_timeout 600s;
  }
}
