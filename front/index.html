<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Git Pulse — GitHub / GitLab</title>
    <script>
      // Stamped before the first paint, from the copy the application leaves
      // behind whenever the preference changes. The real one lives on the
      // server and has not answered yet; waiting for it would flash a white
      // screen at everyone who reads this in the dark.
      (function () {
        try {
          var mode = localStorage.getItem('display.mode') || 'system';
          var direction = localStorage.getItem('display.direction');
          var dark =
            mode === 'system'
              ? matchMedia('(prefers-color-scheme: dark)').matches
              : mode === 'dark';
          document.documentElement.dataset.mode = dark ? 'dark' : 'light';
          if (direction) document.documentElement.dataset.direction = direction;
        } catch (e) {
          // No storage to read: the stylesheet falls back to the media query,
          // which is the right answer for a browser we know nothing about.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
